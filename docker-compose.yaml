  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql

  flask-api:
    build: ../stockIn-service-API/
    ports:
      - '8000:8000'

volumes:
  postgres_data:
